name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 配置 Java 21 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 安装指定版本的 Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # 创建环境变量文件并注入密钥
      - name: Create .env file with secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch .env
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env
          fi

      # 智能处理签名文件
      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Found keystore in GitHub Secrets, decoding..."
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using existing debug.keystore from repository."
          else
            echo "No secret found and no existing keystore. Generating a temporary one..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi

      # 执行打包命令
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      # 上传生成的 APK 文件
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingSync-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # 自动发布所有的变体安装包到 Release
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SingSync AI v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
